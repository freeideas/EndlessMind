<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Garden</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: #efe9ff; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(ellipse at 50% 0%, #2b2552 0%, #121028 55%, #07060f 100%); }
main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
h1 { margin: 0; font-size: 2rem; letter-spacing: .02em; }
.lead { color: #b9b0da; margin: .3rem 0 1rem; }
#signin { margin: 1rem 0 1.5rem; padding: .8rem 1rem; border-radius: 12px; background: #ffffff10; }
#garden { display: grid; grid-template-columns: repeat(6, 1fr); gap: .7rem; margin: 1rem 0; }
.plot { aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; position: relative;
  background: radial-gradient(circle at 50% 60%, #3a2a1c 0%, #22180f 70%); box-shadow: inset 0 -4px 8px #0008; }
.plot:hover { outline: 2px solid #ffffff30; }
.plot.lit { cursor: default; animation: breathe 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.37s);
  background: radial-gradient(circle at 50% 45%, hsl(var(--h) 100% 88%) 0%, hsl(var(--h) 95% 62%) 28%, hsl(var(--h) 80% 30% / .5) 60%, #22180f 75%);
  box-shadow: 0 0 22px 4px hsl(var(--h) 95% 60% / .55); }
@keyframes breathe { 50% { box-shadow: 0 0 34px 10px hsl(var(--h) 95% 60% / .75); filter: brightness(1.15); } }
#count { font-size: 1.1rem; }
a { color: #c9b6ff; }
footer { margin-top: 2rem; color: #8f86b3; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Lantern Garden</h1>
  <p class="lead">Tap the dark soil to plant a glowing seed. Ten seeds earn a record you can keep.</p>
  <div id="signin"></div>
  <p id="count"></p>
  <div id="garden"></div>
  <footer>
    An example realm for <a href="https://endlessmind.com/">Endless Mind</a>. A guest's garden belongs to this browser; sign in to keep yours on any device.
    <a href="https://endlessmind.com/">Find more realms</a>.
  </footer>
</main>
<script type="module">
import { mountSignIn } from "./endlessmind/signin.js";

const garden = document.getElementById("garden");
const count = document.getElementById("count");
let state = { plots: [], size: 24, goal: 10, player: null };

function draw() {
  garden.replaceChildren(...Array.from({ length: state.size }, (_, i) => {
    const plot = document.createElement("button");
    const lit = state.plots.includes(i);
    plot.className = "plot" + (lit ? " lit" : "");
    plot.style.setProperty("--i", i);
    plot.style.setProperty("--h", (i * 47) % 360);
    plot.setAttribute("aria-label", lit ? `Lantern ${i + 1}` : `Plant in plot ${i + 1}`);
    plot.dataset.plot = i;
    if (!lit) plot.onclick = () => plant(i);
    return plot;
  }));
  const n = state.plots.length;
  count.textContent = n >= state.goal
    ? `${n} lanterns glowing. ${state.player ? "You earned the ten-seed record." : "Sign in to earn the ten-seed record."}`
    : `${n} of ${state.goal} seeds toward a record.`;
}

async function load() {
  state = await (await fetch("api/garden", { cache: "no-store" })).json();
  draw();
}

async function plant(plot) {
  state = await (await fetch("api/garden", { method: "POST", body: JSON.stringify({ plot }) })).json();
  draw();
  signIn.refresh();
}

const signIn = mountSignIn(document.getElementById("signin"), { onChange: load });
</script>
</body>
</html>
