[project]
name = "endlessmind"
version = "0.1.0"
description = "Endless Mind for Python game servers: the server side of the realm library"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    { name = "freeideas", email = "freeideas@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    # The same version as shared/qrcodegen.js, so QR codes come out byte for byte the same.
    "qrcodegen==1.8.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
